[project]
name = "genericide-trademark"
version = "0.1.0"
description = "Rule-based trademark infringement and genericide detection. Law & Technology final project."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "spacy>=3.8,<3.9",
    "rapidfuzz>=3.6",
    "praw>=7.7",
    "requests>=2.31",
    "en-core-web-sm",
    "matplotlib>=3.10.9",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
